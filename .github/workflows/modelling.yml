name: MLflow CI/CD Docker Hub

on:
  push:
    branches:
      - main
    paths-ignore:
      - "MLProject/artifacts/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  EXPERIMENT_NAME: heart-disease-svc
  DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
  DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
  IMAGE_NAME: heart-disease-svc

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v6
        uses: actions/checkout@v6

      - name: Set Up Python 3.12.7
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version
          docker --version
          git --version

          if [ -z "${DAGSHUB_REPO_OWNER}" ]; then
            echo "DAGSHUB_REPO_OWNER is empty"
            exit 1
          fi

          if [ -z "${DAGSHUB_REPO_NAME}" ]; then
            echo "DAGSHUB_REPO_NAME is empty"
            exit 1
          fi

          if [ -z "${DAGSHUB_USER_TOKEN}" ]; then
            echo "DAGSHUB_USER_TOKEN is empty"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_ENV"
          echo "Run ID: ${RUN_ID}"

      - name: Install Python dependencies
        run: |
          echo "run mlflow project"

      - name: Upload to Github
        run: |
          rm -rf MLProject/artifacts
          mkdir -p MLProject/artifacts

          mlflow artifacts download \
            --run-id "$RUN_ID" \
            --dst-path MLProject/artifacts

          echo "Downloaded MLflow artifacts:"
          find MLProject/artifacts -maxdepth 3 -type f

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add MLProject/artifacts

          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
          else
            git commit -m "Upload MLflow artifacts for run ${RUN_ID}"
            git push
          fi

      - name: Build Docker Model
        run: |
          cd MLProject
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "${IMAGE_NAME}:${{ github.run_number }}" \
            --env-manager=local

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE_NAME}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${DOCKERHUB_IMAGE}" >> "$GITHUB_ENV"

          docker tag "${IMAGE_NAME}:${{ github.run_number }}" "${DOCKERHUB_IMAGE}:${{ github.run_number }}"
          docker tag "${IMAGE_NAME}:${{ github.run_number }}" "${DOCKERHUB_IMAGE}:${SHORT_SHA}"
          docker tag "${IMAGE_NAME}:${{ github.run_number }}" "${DOCKERHUB_IMAGE}:latest"

          echo "Docker Hub image: ${DOCKERHUB_IMAGE}"
          echo "Tag by runner: ${{ github.run_number }}"
          echo "Tag by commit SHA: ${SHORT_SHA}"
          echo "Tag: latest"

      - name: Push Docker image
        run: |
          docker push "${DOCKERHUB_IMAGE}:${{ github.run_number }}"
          docker push "${DOCKERHUB_IMAGE}:${SHORT_SHA}"
          docker push "${DOCKERHUB_IMAGE}:latest"
