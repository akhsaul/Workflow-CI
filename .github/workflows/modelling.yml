name: MLflow CI/CD Advanced GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  EXPERIMENT_NAME: heart-disease-svc

  DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
  DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}

  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/heart-disease-svc
  IMAGE_TAG: latest

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v6
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'

      - name: Set up Python 3.12.7
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.12.7"
          activate-environment: heart-disease-svc-env
          environment-file: MLProject/conda.yaml

      - name: Check Env
        shell: bash -l {0}
        run: |
          echo "install dependencies"

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          pip install mlflow=='2.19.0'

      - name: Run mlflow project
        shell: bash -l {0}
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        shell: bash -l {0}
        run: |
          echo "run mlflow project"

      - name: Install Python dependencies
        shell: bash -l {0}
        run: |
          echo "run mlflow project"

      - name: Upload to Google Drive
        shell: bash -l {0}
        run: |
          echo "run mlflow project"

      - name: Build Docker Model
        shell: bash -l {0}
        run: |
          echo "run mlflow project"
          # mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "${IMAGE_BASE}:${{ github.run_number }}"

      - name: Log in to Docker Hub
        shell: bash -l {0}
        run: |
          echo "run mlflow project"

      - name: Tag Docker image
        shell: bash -l {0}
        run: |
          # docker tag "${IMAGE_BASE}:${{ github.run_number }}" "${IMAGE_BASE}:latest"
          echo "run mlflow project"

      - name: Push Docker image
        shell: bash -l {0}
        run: |
          echo "run mlflow project"

      - name: Check Project Structure
        shell: bash -l {0}
        run: |
          echo "Repository files:"
          ls -la

          echo "MLProject files:"
          ls -la MLProject

      - name: Check Generated Run Files
        shell: bash -l {0}
        run: |
          echo "Generated files after training:"
          ls -la MLProject

          echo "Run ID:"
          cat MLProject/run_id.txt

          echo "Model URI:"
          cat MLProject/model_uri.txt

      - name: Find and Read MLflow Env Files
        shell: bash -l {0}
        run: |
          echo "Current directory:"
          pwd
          echo "Searching MLflow environment files..."
          find . -type f \( \
            -name "python_env.yaml" -o \
            -name "python_env.yml" -o \
            -name "conda.yaml" -o \
            -name "requirements.txt" -o \
            -name "MLmodel" \
          \) -print

          echo ""
          echo "Reading files:"
          find . -type f \( \
            -name "python_env.yaml" -o \
            -name "python_env.yml" -o \
            -name "conda.yaml" -o \
            -name "requirements.txt" -o \
            -name "MLmodel" \
          \) -print0 | while IFS= read -r -d '' file; do
            echo "============================================================"
            echo "FILE: $file"
            echo "============================================================"
            cat "$file"
            echo ""
          done

      - name: Upload Training Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: heart-disease-training-artifacts
          path: |
            MLProject/models
            MLProject/run_id.txt
            MLProject/model_uri.txt
          if-no-files-found: error

      - name: Set Lowercase GHCR Image Name
        shell: bash
        run: |
          IMAGE_NAME_LOWER=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "FULL_IMAGE_NAME=${IMAGE_NAME_LOWER}:${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "FULL_IMAGE_NAME=${IMAGE_NAME_LOWER}:${IMAGE_TAG}"

      - name: Build Docker Image with MLflow
        shell: bash -l {0}
        env:
          CONDA_PLUGINS_AUTO_ACCEPT_TOS: true
          MLFLOW_TRACKING_URI: file:MLProject/mlruns
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)

          echo "Building Docker image from:"
          echo "$MODEL_URI"
          IMAGE_NAME_LOWER=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')

          echo "Target image:"
          echo "$FULL_IMAGE_NAME"

          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "$IMAGE_NAME_LOWER" --env-manager conda

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image to GHCR
        run: |
          docker push "$FULL_IMAGE_NAME"

      - name: Save GHCR Image Info
        run: |
          echo "GHCR image pushed successfully." > ghcr_image_info.txt
          echo "Image: $FULL_IMAGE_NAME" >> ghcr_image_info.txt
          echo "" >> ghcr_image_info.txt
          echo "Pull command:" >> ghcr_image_info.txt
          echo "docker pull $FULL_IMAGE_NAME" >> ghcr_image_info.txt
          echo "" >> ghcr_image_info.txt
          echo "Run command:" >> ghcr_image_info.txt
          echo "docker run -p 8080:8080 $FULL_IMAGE_NAME" >> ghcr_image_info.txt

          cat ghcr_image_info.txt

      - name: Upload GHCR Image Info
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-image-info
          path: ghcr_image_info.txt
