name: MLflow CI/CD Advanced GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  EXPERIMENT_NAME: heart-disease-svc

  DAGSHUB_REPO_OWNER: ${{ secrets.DAGSHUB_REPO_OWNER }}
  DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_USER_TOKEN }}
  IMAGE_NAME: heart-disease-svc

jobs:
  train-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v6
        uses: actions/checkout@v6

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          echo "install dependencies"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          echo "run mlflow project"

      - name: Install Python dependencies
        run: |
          echo "run mlflow project"

      - name: Upload to Google Drive
        run: |
          echo "run mlflow project"

      - name: Build Docker Model
        run: |
          RUN_ID=$(cat MLProject/run_id.txt)
          echo "Run id: ${RUN_ID}"
          cd MLProject && mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "${IMAGE_NAME}:${{ github.run_number }}" --env-manager=local

      - name: Log in to Docker Hub
        run: |
          echo "run mlflow project"

      - name: Tag Docker image
        run: |
          # docker tag "${IMAGE_NAME}:${{ github.run_number }}" "ghcr.io/repository-owner/${IMAGE_NAME}:latest"
          echo "run mlflow project"

      - name: Push Docker image
        run: |
          echo "run mlflow project"
